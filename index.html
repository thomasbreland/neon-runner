<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Neon Runner</title>
  <style>
    html, body { margin: 0; padding: 0; background: #0a0418; overflow: hidden; }
    body { font-family: "Segoe UI", "Helvetica Neue", sans-serif; }
    #c { position: fixed; inset: 0; display: block; touch-action: none; }

    #hud {
      position: fixed; top: 14px; left: 0; right: 0;
      display: flex; justify-content: space-between;
      padding: 0 18px; pointer-events: none;
      text-shadow: 0 0 12px #ff4bd8, 0 0 4px #7bdcff;
      color: #7bdcff;
    }
    #score { font-size: 26px; font-weight: 700; letter-spacing: 1px; }
    #speed { font-size: 16px; color: #ff4bd8; }
    #best  { font-size: 16px; color: #ffd166; }

    #center {
      position: fixed; top: 34%; left: 0; right: 0;
      text-align: center; pointer-events: none;
      font-size: 44px; font-weight: 800; letter-spacing: 3px;
      color: #ff4bd8;
      text-shadow: 0 0 22px #ff4bd8, 0 0 6px #ffffff;
    }
    #sub {
      position: fixed; top: 44%; left: 0; right: 0;
      text-align: center; pointer-events: none;
      font-size: 17px; color: #7bdcff;
      text-shadow: 0 0 10px #7bdcff;
      white-space: pre;
    }

    /* Touch control widget — shown only on coarse-pointer (touch) devices. */
    #touchpad {
      position: fixed; inset: 0; pointer-events: none;
      display: none;
    }
    @media (pointer: coarse) {
      #touchpad { display: block; }
    }
    #touchpad .btn {
      position: fixed;
      width: 48px; height: 48px;
      border-radius: 12px;
      background: rgba(10, 4, 24, 0.35);
      border: 1.5px solid rgba(123, 220, 255, 0.55);
      box-shadow: 0 0 10px rgba(123, 220, 255, 0.35);
      color: #7bdcff;
      font-size: 20px; line-height: 48px; text-align: center;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* D-pad cluster in the bottom-right corner (48px cells, 4px gaps). */
    #touchpad #btn-up    { right: calc(64px + env(safe-area-inset-right, 0px)); bottom: calc(116px + env(safe-area-inset-bottom, 0px)); }
    #touchpad #btn-down  { right: calc(64px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
    #touchpad #btn-left  { right: calc(116px + env(safe-area-inset-right, 0px)); bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
    #touchpad #btn-right { right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
    /* Pause sits under the BEST readout, which is right-aligned in the HUD. */
    #touchpad #pause-btn {
      top: calc(48px + env(safe-area-inset-top, 0px));
      right: calc(18px + env(safe-area-inset-right, 0px));
      width: 44px; height: 44px; line-height: 44px; font-size: 18px;
      border-radius: 12px;
    }
  </style>
  <script>
    // Page-level error collector so verification can detect silent failures.
    window.__err = [];
    window.addEventListener("error", function (e) {
      window.__err.push(String(e.message || "unknown error") + " @ " + (e.filename || "?"));
    });
    window.addEventListener("unhandledrejection", function (e) {
      window.__err.push("unhandledrejection: " + String(e.reason));
    });
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="score">0</div>
    <div id="speed">13 m/s</div>
    <div id="best">BEST 0</div>
  </div>
  <div id="center"></div>
  <div id="sub"></div>

  <!-- Touch controls: swipe anywhere on the canvas, or tap this corner widget. -->
  <div id="touchpad">
    <div id="btn-left" class="btn">&#9664;</div>
    <div id="btn-right" class="btn">&#9654;</div>
    <div id="btn-up" class="btn">&#9650;</div>
    <div id="btn-down" class="btn">&#9660;</div>
    <div id="pause-btn" class="btn">&#10074;&#10074;</div>
  </div>

  <script type="module" src="./game.js"></script>
</body>
</html>
